<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blessman Forum - Auto News Naija & World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Verdana,Arial,sans-serif}
body{background:#000;color:#fff}
.header{background:#003300;border-bottom:4px solid #1a5c1a;padding:12px;text-align:center;position:sticky;top:0;z-index:20}
.header h1{font-size:26px;color:#e8f5e8;cursor:pointer}
.navline{font-size:12px;margin:6px 0;color:#c8e6c8}
.navline span{cursor:pointer;padding:2px 6px;background:#0a2a0a;border-radius:10px;margin:2px;display:inline-block}
.stats{font-size:11px;margin-top:8px;background:#001a00;padding:6px;border-radius:6px}
.search-box{margin:12px auto;display:flex;gap:8px;justify-content:center;max-width:500px}
.search-box input{flex:1;padding:8px 12px;border-radius:20px;border:1px solid #2d5a2d;background:#0a1a0a;color:#fff}
.search-box button{padding:8px 16px;border-radius:20px;border:none;background:#2d5a2d;color:#fff;cursor:pointer}
.main{max-width:950px;margin:10px auto;padding:0 8px}
.card{background:#0f2f0f;border:1px solid #1a4d1a;border-radius:12px;padding:12px;margin:10px 0}
.card h2{text-align:center;font-size:15px;margin-bottom:10px;color:#d0f0d0}
.news-tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.news-tabs button{padding:6px 14px;border-radius:20px;border:1px solid #2d5a2d;background:#0a1a0a;color:#c8e6c8;cursor:pointer;white-space:nowrap;font-size:12px}
.news-tabs button.active{background:#2d5a2d;color:#fff;font-weight:bold}
.news-item{background:#fffbe6;color:#000;border:1px solid #999;border-radius:6px;margin:8px 0;padding:10px;cursor:pointer;display:flex;gap:10px}
.news-item img{width:80px;height:60px;object-fit:cover;border-radius:4px;background:#ddd}
.news-title{font-weight:bold;font-size:13px;color:#000;line-height:1.3}
.news-meta{font-size:11px;color:#666;margin-top:4px}
.category-text{font-size:13px;line-height:1.7;color:#c8e6c8}
.category-text b{color:#e8ffe8}
.category-text span{cursor:pointer}
.create-btn{background:#2e5a2e;color:#fff;border:none;width:100%;padding:10px;font-weight:bold;cursor:pointer;font-size:14px;border-radius:6px}
.topic-header{background:#e8e8d0;padding:6px 10px;font-weight:bold;font-size:13px;color:#333;border-radius:4px 4px 0 0;margin-top:10px}
.topic{background:#f5f5e5;color:#000;border:1px solid #999;border-radius:0 0 4px 4px;margin:0 0 6px 0;overflow:hidden;cursor:pointer}
.topic-body{padding:10px;background:#fffbe6}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;align-items:center;justify-content:center;padding:10px}
.modal.show{display:flex}
.modal-box{background:#fff;color:#000;width:100%;max-width:700px;border-radius:8px;max-height:90vh;overflow:auto}
.modal-header{background:#003300;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:15px}
.modal-body button{background:#003300;color:#fff;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;margin-top:8px}
.comment{background:#f0f0e0;padding:10px;margin:8px 0;border-left:3px solid #2e5a2e;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#003300;color:#fff;padding:10px 20px;border-radius:20px;display:none;z-index:200;font-size:13px}
.loader{text-align:center;padding:20px;color:#90ee90}
</style>
</head>
<body>
<div class="header">
<h1 onclick="location.reload()">BLESSMAN FORUM • AUTO NEWS</h1>
<div class="navline">
Welcome, <b id="userLabel">Guest</b>: 
<span onclick="openModal('registerModal')">Register</span>
<span onclick="filterBy('all')">All Boards</span>
<span onclick="fetchAllNews()">🔄 Refresh News</span>
<span onclick="openModal('createModal')">+ Post</span>
</div>
<div class="stats"><b>Live:</b> <span id="memberCount">1</span> members, <span id="topicCount">0</span> news • Auto-fetch Naija + BBC • <span id="dateStr"></span></div>
<div class="search-box"><input id="searchInput" placeholder="Search news, topics, boards..."><button onclick="doSearch()">Search</button></div>
</div>

<div class="main">
<div class="card">
<h2>🔴 LIVE NEWS FEED - Auto from Newspapers</h2>
<div class="news-tabs" id="newsTabs">
<button class="active" onclick="switchNews('naija')">🇳🇬 Naija News</button>
<button onclick="switchNews('bbc')">🌍 BBC World</button>
<button onclick="switchNews('politics')">🏛️ Politics</button>
<button onclick="switchNews('sports')">⚽ Sports</button>
<button onclick="switchNews('business')">💰 Business</button>
<button onclick="switchNews('entertainment')">🎬 Entertainment</button>
</div>
<div id="newsContainer"><div class="loader">⏳ Loading live news from Punch, Vanguard, BBC...</div></div>
</div>

<div class="card">
<h2>Forum Boards - Click to filter</h2>
<div class="category-text" id="categoryList"></div>
<button class="create-btn" style="margin-top:10px" onclick="openModal('createModal')">+ CREATE NEW TOPIC</button>
<div id="topicsContainer"></div>
</div>
</div>

<div class="modal" id="viewModal"><div class="modal-box"><div class="modal-header"><b id="viewTitle">News</b><span onclick="closeModal('viewModal')" style="cursor:pointer;font-size:20px">×</span></div><div class="modal-body" id="viewBody"></div></div></div>
<div class="modal" id="createModal"><div class="modal-box"><div class="modal-header"><b>Create Topic</b><span onclick="closeModal('createModal')" style="cursor:pointer">×</span></div><div class="modal-body"><select id="newCategory"></select><input id="newTitle" placeholder="Title"><textarea id="newContent" rows="4" placeholder="Content"></textarea><button onclick="createTopic()">Post</button></div></div></div>
<div class="modal" id="registerModal"><div class="modal-box"><div class="modal-header"><b>Join Forum</b><span onclick="closeModal('registerModal')" style="cursor:pointer">×</span></div><div class="modal-body"><input id="regName" placeholder="Your name"><button onclick="register()">Register</button></div></div></div>
<div id="toast"></div>

<script>
const boards = {
"Naija General": ["Politics","Crime","Romance","Jobs","Business","Education","Health","Travel","Family","Culture","Food","Agriculture","Properties"],
"Entertainment": ["Jokes","TV/Movies","Music","Celebrities","Fashion","Events","Sports","Gaming","Literature"],
"Tech": ["Programming","Webmasters","Computers","Phones","Art","Technology Market"]
};

const RSS_FEEDS = {
naija: [
"https://www.vanguardngr.com/feed/",
"https://punchng.com/feed/",
"https://www.premiumtimesng.com/feed/"
],
bbc: ["http://feeds.bbci.co.uk/news/world/rss.xml"],
politics: ["http://feeds.bbci.co.uk/news/politics/rss.xml","https://www.vanguardngr.com/category/politics/feed/"],
sports: ["http://feeds.bbci.co.uk/sport/rss.xml?edition=uk","https://www.vanguardngr.com/category/sports/feed/"],
business: ["http://feeds.bbci.co.uk/news/business/rss.xml"],
entertainment: ["http://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml"]
};

let allNews = [];
let manualTopics = JSON.parse(localStorage.getItem('naija_topics')||'[]');
let currentNewsType='naija';
let currentUser=localStorage.getItem('naija_user')||'Guest';
let comments=JSON.parse(localStorage.getItem('naija_comments')||'{}');

function init(){
document.getElementById('userLabel').textContent=currentUser;
document.getElementById('dateStr').textContent=new Date().toLocaleString('en-NG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
let catHtml=''; let opts='';
for(let sec in boards){
catHtml+='<b>'+sec+':</b> '+boards[sec].map(c=>'<span onclick="filterBy(\''+c+'\')">'+c+'</span>').join(', ')+'<br><br>';
boards[sec].forEach(c=>opts+='<option value="'+c+'">'+c+'</option>');
}
document.getElementById('categoryList').innerHTML=catHtml;
document.getElementById('newCategory').innerHTML=opts;
fetchAllNews();
renderManual();
}

async function fetchRSS(url){
try{
let api=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
let res=await fetch(api);
let data=await res.json();
if(data.status==='ok') return data.items.slice(0,8).map(i=>({
id: 'rss_'+Math.random().toString(36).substr(2,9),
title: i.title,
link: i.link,
desc: i.description.replace(/<[^>]*>/g,'').slice(0,200)+'...',
image: i.enclosure?.link || i.thumbnail || '',
time: new Date(i.pubDate).getTime(),
source: new URL(url).hostname.replace('www.',''),
cat: currentNewsType
}));
}catch(e){console.log('RSS fail',url)}
return [];
}

async function fetchAllNews(){
document.getElementById('newsContainer').innerHTML='<div class="loader">⏳ Fetching live news... Punch, Vanguard, BBC...</div>';
allNews=[];
for(let feed of RSS_FEEDS[currentNewsType]){
let items=await fetchRSS(feed);
allNews=allNews.concat(items);
}
allNews.sort((a,b)=>b.time-a.time);
if(allNews.length===0){
// fallback dummy news if API fails
allNews=[
{title:"Tinubu meets governors on new minimum wage",desc:"President Bola Tinubu don meet with state governors to discuss new minimum wage implementation across Nigeria...",source:"vanguardngr.com",time:Date.now(),link:"#",image:"",cat:"naija"},
{title:"Super Eagles qualify for World Cup 2026!",desc:"Nigeria Super Eagles don beat Ghana 2-0 to qualify for World Cup 2026 for USA...",source:"punchng.com",time:Date.now()-1000000,link:"#",image:"",cat:"sports"},
{title:"BBC: World Bank approves $2bn for Nigeria infrastructure",desc:"World Bank don approve $2 billion loan for Nigeria to improve roads and power...",source:"bbc.co.uk",time:Date.now()-2000000,link:"#",image:"",cat:"business"},
{title:"Fuel price drop to N850 for some stations Lagos",desc:"Some filling stations for Lagos don reduce fuel price from N950 to N850...",source:"premiumtimesng.com",time:Date.now()-3000000,link:"#",image:"",cat:"naija"}
];
}
renderNews();
}

function renderNews(){
let q=document.getElementById('searchInput').value.toLowerCase();
let list=allNews.filter(n=>!q || n.title.toLowerCase().includes(q));
let html='';
list.slice(0,20).forEach(n=>{
html+=`<div class="news-item" onclick="openNews('${n.id}')">
${n.image?`<img src="${n.image}" onerror="this.style.display='none'">`:''}
<div><div class="news-title">${n.title}</div><div class="news-meta">${n.source} • ${timeAgo(n.time)} • ${n.cat}</div><div style="font-size:11px;margin-top:4px;color:#444">${n.desc.slice(0,100)}...</div></div>
</div>`;
});
if(!html) html='<div style="text-align:center;padding:20px;color:#fff">No news found. Click Refresh.</div>';
document.getElementById('newsContainer').innerHTML=html;
document.getElementById('topicCount').textContent=allNews.length + manualTopics.length;
}

function switchNews(type){
currentNewsType=type;
document.querySelectorAll('.news-tabs button').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
fetchAllNews();
toast('Loading '+type+' news...');
}

function openNews(id){
let n=allNews.find(x=>x.id===id); if(!n) return;
document.getElementById('viewTitle').textContent=n.title;
let chtml=`<div style="font-size:11px;color:#666">${n.source} • ${timeAgo(n.time)} • <a href="${n.link}" target="_blank" style="color:green">Read original</a></div>
<div style="margin:12px 0"><img src="${n.image}" style="width:100%;max-height:200px;object-fit:cover;border-radius:6px" onerror="this.style.display='none'"></div>
<div style="line-height:1.6">${n.desc}<br><br>${n.title} - Full details dey for source. Discuss am for comments!</div>
<hr style="margin:12px 0">
<div id="commentList"></div>
<textarea id="replyText" placeholder="Comment on this news..." rows="3" style="width:100%;padding:8px"></textarea>
<input id="replyName" placeholder="Your name" value="${currentUser!=='Guest'?currentUser:''}" style="width:100%;padding:8px;margin-top:6px">
<button onclick="postComment('${id}')">Post Comment</button>
`;
document.getElementById('viewBody').innerHTML=chtml;
renderComments(id);
openModal('viewModal');
}

function renderComments(id){
let list=comments[id]||[];
let html=list.map(c=>`<div class="comment"><b>${c.author}</b> • ${timeAgo(c.time)}<br><br>${c.text}</div>`).join('');
document.getElementById('commentList').innerHTML=html||'<div style="color:#666;font-size:12px">No comments yet. Be first!</div>';
}

function postComment(id){
let txt=document.getElementById('replyText').value.trim(); if(!txt) return toast('Write comment');
let name=document.getElementById('replyName').value.trim()||'Guest';
if(!comments[id]) comments[id]=[];
comments[id].push({author:name,text:txt,time:Date.now()});
localStorage.setItem('naija_comments',JSON.stringify(comments));
document.getElementById('replyText').value='';
renderComments(id);
toast('Comment posted!');
}

function filterBy(cat){
currentNewsType=cat.toLowerCase();
document.getElementById('searchInput').value=cat;
renderNews();
toast('Filtering: '+cat);
}

function doSearch(){renderNews(); renderManual();}
function renderManual(){
let q=document.getElementById('searchInput').value.toLowerCase();
let list=manualTopics.filter(t=>!q || t.title.toLowerCase().includes(q));
let html='';
if(list.length>0){
list.forEach(t=>{
html+=`<div class="topic" onclick="openManual(${t.id})"><div class="topic-body"><div class="topic-title">${t.title}</div><div class="news-meta">${t.cat} • by ${t.author} • ${timeAgo(t.time)}</div></div></div>`;
});
}
document.getElementById('topicsContainer').innerHTML=html?`<div class="topic-header">Member Topics</div>`+html:'';
}

function openManual(id){
let t=manualTopics.find(x=>x.id===id); if(!t) return;
document.getElementById('viewTitle').textContent=t.title;
document.getElementById('viewBody').innerHTML=`<div class="comment"><b>${t.author}</b><br><br>${t.content}</div><div id="commentList"></div><textarea id="replyText" placeholder="Reply..." rows="3" style="width:100%;padding:8px;margin-top:10px"></textarea><button onclick="postComment('${id}')">Reply</button>`;
renderComments(id);
openModal('viewModal');
}

function createTopic(){
let title=document.getElementById('newTitle').value.trim();
let content=document.getElementById('newContent').value.trim();
let cat=document.getElementById('newCategory').value;
if(!title||!content) return toast('Need title & content');
manualTopics.unshift({id:Date.now(),title,content,cat,author:currentUser,time:Date.now()});
localStorage.setItem('naija_topics',JSON.stringify(manualTopics));
closeModal('createModal'); renderManual(); toast('Topic posted!');
}

function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function register(){let n=document.getElementById('regName').value.trim(); if(!n) return toast('Enter name'); currentUser=n; localStorage.setItem('naija_user',n); localStorage.setItem('naija_users', (parseInt(localStorage.getItem('naija_users')||1)+1)); document.getElementById('userLabel').textContent=n; closeModal('registerModal'); toast('Welcome '+n); document.getElementById('memberCount').textContent=localStorage.getItem('naija_users');}
function toast(m){let t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500);}
function timeAgo(ts){let s=Math.floor((Date.now()-ts)/1000); if(s<60) return s+'s ago'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago';}

init();
setInterval(fetchAllNews, 600000); // auto refresh every 10 mins
</script>
</body>
</html>
