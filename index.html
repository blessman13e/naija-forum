<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blessman Forum</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Verdana,Arial,sans-serif}
body{background:#000;color:#c8e6c8}
.header{background:#003300;border-bottom:4px solid #1a5c1a;padding:12px 8px;text-align:center;position:sticky;top:0;z-index:20}
.header h1{font-size:26px;color:#e8f5e8;text-decoration:line-through;text-decoration-thickness:2px;cursor:pointer}
.navline{font-size:13px;margin:8px 0;color:#c8e6c8;line-height:1.8}
.navline b{color:#fff}
.navline span{cursor:pointer;padding:2px 6px}
.search-box{margin:10px auto;display:flex;gap:6px;max-width:400px;justify-content:center}
.search-box input{flex:1;padding:8px 14px;border-radius:20px;border:1px solid #2d5a2d;background:#0a1a0a;color:#fff;max-width:250px}
.search-box button{padding:8px 16px;border-radius:20px;border:none;background:#222;color:#fff;cursor:pointer}
.main{max-width:850px;margin:0 auto;padding:0 4px}
.card{background:#0e2e0e;border:1px solid #1a4d1a;border-radius:10px;padding:12px;margin:8px 0}
.welcome-title{font-size:16px;font-weight:bold;color:#e8f5c8;text-align:center;margin-bottom:12px}
.boards{font-size:14px;line-height:2;color:#8cc48c}
.boards .sec{margin-bottom:16px}
.boards b{color:#fff;display:block;margin-bottom:4px}
.boards span{cursor:pointer;color:#a8d8a8;display:inline-block;margin-right:12px}
.boards span:hover{color:#fff;text-decoration:underline;font-weight:bold}
.news-header{font-size:15px;font-weight:bold;color:#fff;text-align:center;padding:8px;background:#1a4d1a;border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.news-list{line-height:1.6;min-height:100px}
.news-item{padding:10px 4px;border-bottom:1px dotted #1a4d1a;font-size:14px;color:#d0f0d0;cursor:pointer}
.news-item:hover{background:#142e14}
.news-item b{color:#90ee90;font-weight:normal}
.meta{font-size:10px;color:#7aaa7a;display:block;margin-top:3px}
.back-btn{background:#1a4d1a;color:#fff;border:none;padding:6px 14px;border-radius:12px;cursor:pointer;font-size:12px}
.admin-btn{background:#ffcc00;color:#000;border:none;padding:6px 14px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:bold;display:none}
.admin-btn.show{display:inline-block}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:99;align-items:center;justify-content:center;padding:10px}
.modal.show{display:flex}
.modal-box{background:#f5f5e5;color:#000;width:100%;max-width:700px;border-radius:8px;max-height:92vh;overflow:auto}
.modal-header{background:#003300;color:#fff;padding:10px;display:flex;justify-content:space-between}
.modal-body{padding:12px;font-size:13px;line-height:1.6}
.comment{background:#e8e8d0;padding:8px;margin:6px 0;border-left:3px solid #2d5a2d;font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#003300;color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:200;font-size:13px}
input,textarea,select{border:1px solid #888;border-radius:4px;padding:10px;width:100%;margin:6px 0;font-size:14px}
.date{font-size:12px;color:#9ccc9c;margin-top:6px}
</style>
</head>
<body>
<div class="header">
<h1 onclick="showHome()">BLESSMAN FORUM</h1>
<div class="navline">Welcome, <b id="userLabel">Guest</b>: <span onclick="openModal('regModal')">Register</span> • <span onclick="openModal('loginModal')">Login</span> • <span onclick="showAllTopics()">Trending</span> • <span onclick="showAllTopics()">Recent</span> <span id="adminBadge" style="color:#ffcc00;font-size:11px"></span></div>
<div class="date" id="dateStr"></div>
<div class="search-box"><input id="q" placeholder="Search..."><button onclick="doSearch()">Search</button></div>
</div>
<div class="main">
<div class="card" id="homeCard">
<div class="welcome-title">Welcome to Blessman Forum</div>
<div class="boards" id="boardList"></div>
<div style="text-align:center;margin-top:15px;font-size:11px"><span style="color:#ffcc00;cursor:pointer;text-decoration:underline" onclick="openModal('adminLoginModal')">🔐 Admin Login</span> <span style="color:#666">- Only Admin can post news</span></div>
</div>
<div class="card" id="topicCard" style="display:none">
<div class="news-header"><span id="boardTitle">Politics</span> <span><button class="back-btn" onclick="showHome()">← Boards</button> <button class="admin-btn" id="newTopicBtn" onclick="openModal('postModal')">+ New Topic</button></span></div>
<div class="news-list" id="newsBox"></div>
</div>
</div>
<div class="modal" id="viewModal"><div class="modal-box"><div class="modal-header"><b id="vTitle"></b><span onclick="closeModal('viewModal')" style="cursor:pointer;font-size:22px">×</span></div><div class="modal-body" id="vBody"></div></div></div>
<div class="modal" id="adminLoginModal"><div class="modal-box"><div class="modal-header"><b>🔐 Admin Login</b><span onclick="closeModal('adminLoginModal')" style="cursor:pointer">×</span></div><div class="modal-body">
<input id="adminPass" type="password" placeholder="Password (default: blessman123)">
<button onclick="adminLogin()" style="background:#003300;color:#fff;padding:10px;border:none;border-radius:5px;width:100%;font-weight:bold;margin-top:10px">Login as Admin</button>
<div style="margin-top:12px;text-align:center"><span onclick="adminLogout()" style="font-size:11px;color:#cc0000;cursor:pointer;text-decoration:underline">Logout</span></div>
</div></div></div>
<div class="modal" id="postModal"><div class="modal-box"><div class="modal-header"><b id="postHeader">Create New Topic (Admin)</b><span onclick="closeModal('postModal')" style="cursor:pointer">×</span></div><div class="modal-body">
<input id="pTitle" placeholder="Paste Title from Nairaland/Punch">
<select id="pCat"></select>
<textarea id="pBody" rows="8" placeholder="Paste full story content here..."></textarea>
<button onclick="createPost()" style="background:#003300;color:#fff;padding:12px;border:none;border-radius:5px;width:100%;font-weight:bold;margin-top:8px">Post Topic</button>
</div></div></div>
<div class="modal" id="regModal"><div class="modal-box"><div class="modal-header"><b>Register</b><span onclick="closeModal('regModal')" style="cursor:pointer">×</span></div><div class="modal-body"><input id="rName" placeholder="Username"><button onclick="doReg()" style="background:#003300;color:#fff;padding:10px;border:none;border-radius:4px;margin-top:8px;width:100%">Register (Can Comment Only)</button></div></div></div>
<div class="modal" id="loginModal"><div class="modal-box"><div class="modal-header"><b>Login</b><span onclick="closeModal('loginModal')" style="cursor:pointer">×</span></div><div class="modal-body"><input id="lName" placeholder="Username"><button onclick="doLogin()" style="background:#003300;color:#fff;padding:10px;border:none;border-radius:4px;margin-top:8px;width:100%">Login</button></div></div></div>
<div id="toast"></div>
<script>
const boardData={"Blessman General":["Politics","Crime","Romance","Jobs/Vacancies","Career","Business","Investment","NYSC","Education","Autos","Car Talk","Properties","Health","Travel","Family","Culture","Food","Agriculture"],"Entertainment":["Jokes","TV/Movies","Music/Radio","Celebrities","Fashion","Events","Sports","Gaming","Literature"],"Science/Technology":["Programming","Webmasters","Computers","Phones","Technology Market"]};
let currentBoard=null;
let user=localStorage.getItem('naija_user')||'Guest';
let isAdmin=localStorage.getItem('isAdmin')==='true';
let ADMIN_PASS=localStorage.getItem('admin_pass')||'blessman123';
let TOPICS=JSON.parse(localStorage.getItem('bless_topics')||'[]');
let comments=JSON.parse(localStorage.getItem('bless_comments')||'{}');
function save(){localStorage.setItem('bless_topics',JSON.stringify(TOPICS));localStorage.setItem('bless_comments',JSON.stringify(comments));}
function init(){
document.getElementById('userLabel').textContent=user+(isAdmin?' (Admin)':'');
document.getElementById('dateStr').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' at '+new Date().toLocaleTimeString();
let html=''; let opts='';
for(let sec in boardData){ html+=`<div class="sec"><b>${sec}:</b><br>`+boardData[sec].map(b=>`<span onclick="openBoard('${b}')">${b}</span>`).join('')+'</div>'; boardData[sec].forEach(b=>opts+=`<option value="${b}">${b}</option>`); }
document.getElementById('boardList').innerHTML=html;
document.getElementById('pCat').innerHTML=opts;
updateAdminUI();
}
function updateAdminUI(){
if(isAdmin){ document.getElementById('newTopicBtn').classList.add('show'); document.getElementById('adminBadge').textContent='🔐 Admin Mode'; document.getElementById('userLabel').textContent=user+' (Admin)'; }
else { document.getElementById('newTopicBtn').classList.remove('show'); document.getElementById('adminBadge').textContent=''; }
}
function adminLogin(){
let p=document.getElementById('adminPass').value;
if(p===ADMIN_PASS){ isAdmin=true; localStorage.setItem('isAdmin','true'); user='Admin'; localStorage.setItem('naija_user',user); closeModal('adminLoginModal'); init(); toast('✅ Admin Mode ON - You can now post!'); if(currentBoard) renderTopics(); }
else toast('❌ Wrong password! Default: blessman123');
}
function adminLogout(){ isAdmin=false; localStorage.removeItem('isAdmin'); user='Guest'; localStorage.setItem('naija_user',user); init(); toast('Admin OFF'); closeModal('adminLoginModal'); if(currentBoard) renderTopics(); }
function openBoard(board){
currentBoard=board;
document.getElementById('homeCard').style.display='none';
document.getElementById('topicCard').style.display='block';
document.getElementById('boardTitle').textContent=board;
document.getElementById('pCat').value=board;
document.getElementById('postHeader').textContent='New Topic in '+board;
renderTopics(); window.scrollTo({top:0,behavior:'smooth'});
}
function showHome(){ document.getElementById('homeCard').style.display='block'; document.getElementById('topicCard').style.display='none'; currentBoard=null; document.getElementById('q').value=''; }
function showAllTopics(){ currentBoard=null; document.getElementById('homeCard').style.display='none'; document.getElementById('topicCard').style.display='block'; document.getElementById('boardTitle').textContent='All Topics'; renderTopics(true); }
function renderTopics(all=false){
let q=document.getElementById('q').value.toLowerCase();
let list=[...TOPICS];
if(!all && currentBoard) list=list.filter(t=>t.cat.toLowerCase()===currentBoard.toLowerCase());
if(q) list=list.filter(t=>t.title.toLowerCase().includes(q) || t.body.toLowerCase().includes(q));
let html='';
if(list.length===0){
if(isAdmin){ html=`<div style="text-align:center;padding:30px"><div style="font-size:14px;margin-bottom:10px">No topics in <b>${currentBoard||'All Boards'}</b> yet.</div><div style="font-size:12px;color:#888;margin-bottom:15px">Be the first to post! Copy from Nairaland and paste.</div><button onclick="openModal('postModal')" style="background:#ffcc00;color:#000;padding:10px 20px;border:none;border-radius:20px;font-weight:bold">+ Post First Topic in ${currentBoard||'Board'}</button></div>`; }
else { html=`<div style="text-align:center;padding:30px;color:#888"><div>No topics in <b>${currentBoard||'All Boards'}</b> yet.</div><div style="font-size:11px;margin-top:10px">Only Admin can post. Check back later or click Boards to explore.</div></div>`; }
} else {
list.forEach(t=>{ let realIdx=TOPICS.indexOf(t); html+=`<div class="news-item" onclick="viewTopic(${realIdx})">» <b>${t.title}</b> «<span class="meta">${t.author} • ${timeAgo(t.time)} • ${t.cat} • ${(comments['c_'+realIdx]||[]).length} comments</span></div>`; });
}
document.getElementById('newsBox').innerHTML=html;
}
function viewTopic(idx){
let t=TOPICS[idx]; if(!t) return;
document.getElementById('vTitle').textContent=t.title;
document.getElementById('vBody').innerHTML=`<div style="font-size:10px;color:#666">${t.author} • ${timeAgo(t.time)} • ${t.cat}</div><div style="margin:12px 0;white-space:pre-wrap;line-height:1.6">${t.body}</div><hr><div style="margin-top:10px;font-weight:bold">Comments (${(comments['c_'+idx]||[]).length})</div><div id="cList"></div><textarea id="ct" placeholder="Comment as ${user}..." rows="3" style="width:100%;margin-top:8px"></textarea><input id="cn" placeholder="Name" value="${user!=='Guest'?user:''}"><button onclick="postComment(${idx})" style="background:#003300;color:#fff;padding:8px 14px;border:none;border-radius:4px;margin-top:6px">Post Comment</button>`;
renderComments(idx); openModal('viewModal');
}
function renderComments(idx){ let id='c_'+idx; let list=comments[id]||[]; document.getElementById('cList').innerHTML=list.map(c=>`<div class="comment"><b>${c.author}</b> • ${timeAgo(c.time)}<br>${c.text}</div>`).join('')||'<div style="font-size:11px;color:#888">No comments yet.</div>'; }
function postComment(idx){ let txt=document.getElementById('ct').value.trim(); if(!txt) return toast('Write comment'); let name=document.getElementById('cn').value.trim()||'Guest'; let id='c_'+idx; if(!comments[id]) comments[id]=[]; comments[id].push({author:name,text:txt,time:Date.now()}); save(); document.getElementById('ct').value=''; renderComments(idx); toast('Comment posted!'); renderTopics(); }
function createPost(){
if(!isAdmin){ return toast('❌ Only Admin! Login first'); }
let title=document.getElementById('pTitle').value.trim();
let body=document.getElementById('pBody').value.trim();
let cat=document.getElementById('pCat').value;
if(!title||!body) return toast('Need Title + Body');
TOPICS.unshift({title:title,cat:cat,author:'Admin',time:Date.now(),body:body});
save(); closeModal('postModal');
document.getElementById('pTitle').value=''; document.getElementById('pBody').value='';
renderTopics(); toast('✅ Posted in '+cat);
}
function doSearch(){ if(document.getElementById('homeCard').style.display!=='none'){ showAllTopics(); } else { renderTopics(currentBoard===null); } }
function openModal(id){document.getElementById(id).classList.add('show'); if(id==='postModal' && !isAdmin){ closeModal(id); openModal('adminLoginModal'); toast('Admin only! Login'); }}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function doReg(){let n=document.getElementById('rName').value.trim(); if(!n) return toast('Enter name'); user=n; localStorage.setItem('naija_user',n); document.getElementById('userLabel').textContent=n; closeModal('regModal'); toast('Welcome '+n+' - You can comment');}
function doLogin(){let n=document.getElementById('lName').value.trim(); if(!n) return toast('Enter name'); user=n; localStorage.setItem('naija_user',n); document.getElementById('userLabel').textContent=n+(isAdmin?' (Admin)':''); closeModal('loginModal'); toast('Welcome '+n);}
function toast(m){let t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000);}
function timeAgo(ts){let s=Math.floor((Date.now()-ts)/1000); if(s<60) return s+'s ago'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago';}
init();
</script>
</body>
</html>
